    <!-- Paint the page background before React mounts so there is no white flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mi-theme");
          if (stored !== "dark" && stored !== "light") {
            var legacy = localStorage.getItem("isDark");
            if (legacy !== null) {
              stored = legacy === "true" ? "dark" : "light";
            } else {
              stored = "light";
            }
          }
          document.documentElement.setAttribute("data-theme", stored);
          document.documentElement.style.colorScheme = stored;
          document.documentElement.style.background =
            stored === "dark" ? "#19231f" : "#faf9f6";
        } catch (e) {}
      })();
    </script>
